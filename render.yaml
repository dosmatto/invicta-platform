# Render Blueprint — backend de interpolacao (fertilidade).
# No Render: New > Blueprint > conecte este repositorio (ele le este arquivo).
services:
  - type: web
    name: invicta-fertilidade-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Standard = mais CPU/RAM (sempre ligado) — a krigagem é pesada em CPU e o
    # "Processar tudo" roda 26 mapas em fila; o starter (~0,5 vCPU) era o gargalo.
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
