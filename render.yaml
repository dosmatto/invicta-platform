# Render Blueprint — backend de interpolacao (fertilidade).
# No Render: New > Blueprint > conecte este repositorio (ele le este arquivo).
services:
  - type: web
    name: invicta-fertilidade-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Standard = mais CPU/RAM (sempre ligado) — a krigagem é pesada em CPU e o
    # "Processar tudo" roda 26 mapas em fila; o starter (~0,5 vCPU) era o gargalo.
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    # Só rebuilda quando muda o BACKEND. Sem isto, CADA push no repositório (inclui
    # todo deploy do FRONT) reiniciava o interpolador; quem clicava "Processar"
    # durante o restart caía no "servidor acordando" e esperava ~1 min antes do 1º
    # mapa — parecia interpolação lentíssima, mas o cálculo em si leva ~2s.
    buildFilter:
      paths:
        - backend/**
        - render.yaml
